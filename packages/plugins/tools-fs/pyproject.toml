[project]
name = "hermes-plugin-tools-fs"
version = "0.1.0"
description = "Workspace-scoped filesystem tools for Hermes Zero"
requires-python = ">=3.11,<3.14"
dependencies = ["hermes-host", "hermes-agent-sdk"]

[project.entry-points."hermes_host.plugins"]
"hermes.tools.fs" = "hermes_plugin_tools_fs/plugin.json"

[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_plugin_tools_fs = ["plugin.json"]
