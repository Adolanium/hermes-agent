[project]
name = "hermes-host"
version = "0.1.0"
description = "Hermes Zero plugin host: load and compose plugins, implement none of them"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Nous Research" }]
license = "MIT"
dependencies = [
  # Kernel-only. Feature SDKs (openai, fastapi, prompt_toolkit, …) belong to plugins.
  "pyyaml==6.0.3",
  "packaging==26.0",
]

[project.scripts]
hermes-host = "hermes_host.cli:main"

[project.urls]
Homepage = "https://github.com/NousResearch/hermes-agent"

[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_host = ["py.typed"]
