[project]
name = "hermes-plugin-policy-workspace"
version = "0.1.0"
description = "Fail-closed workspace filesystem policy for Hermes Zero"
requires-python = ">=3.11,<3.14"
dependencies = ["hermes-host"]

[project.entry-points."hermes_host.plugins"]
"hermes.policy.workspace" = "hermes_plugin_policy_workspace/plugin.json"

[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_plugin_policy_workspace = ["plugin.json"]
