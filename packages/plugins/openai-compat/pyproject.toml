[project]
name = "hermes-plugin-openai-compat"
version = "0.1.0"
description = "OpenAI-compatible HTTP provider for Hermes Zero"
requires-python = ">=3.11,<3.14"
dependencies = ["hermes-host", "hermes-agent-sdk"]

[project.entry-points."hermes_host.plugins"]
"hermes.provider.openai-compat" = "hermes_plugin_openai_compat/plugin.json"

[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_plugin_openai_compat = ["plugin.json"]
