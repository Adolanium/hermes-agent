[project]
name = "hermes-plugin-agent-runtime"
version = "0.1.0"
description = "Replaceable conversation loop for Hermes Zero"
requires-python = ">=3.11,<3.14"
dependencies = ["hermes-host", "hermes-agent-sdk"]

[project.entry-points."hermes_host.plugins"]
"hermes.agent.runtime" = "hermes_plugin_agent_runtime/plugin.json"

[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_plugin_agent_runtime = ["plugin.json"]
